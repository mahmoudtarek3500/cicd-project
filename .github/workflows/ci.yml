name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node.js
        run: node --version

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t mahmoudtarek3500/cicd-node-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push mahmoudtarek3500/cicd-node-app:latest

      - name: Install Ansible
        run: sudo apt-get update && sudo apt-get install -y ansible

      - name: Install Ansible Docker collection
        run: ansible-galaxy collection install community.docker

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/cicd-ec2-key.pem
          chmod 600 ~/.ssh/cicd-ec2-key.pem

      - name: Create Ansible inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ansible
          printf '%s\n' '[web]' > ansible/inventory
          printf '%s\n' "ec2 ansible_host=$EC2_HOST ansible_user=ubuntu" >> ansible/inventory

      - name: Test Ansible connection
        run: ANSIBLE_HOST_KEY_CHECKING=False ansible web -i ansible/inventory -m ping --private-key ~/.ssh/cicd-ec2-key.pem

      - name: Deploy with Ansible
        run: ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i ansible/inventory ansible/deploy.yml --private-key ~/.ssh/cicd-ec2-key.pem

