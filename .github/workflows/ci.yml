name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node.js
        run: node --version

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t cicd-node-app .