name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node.js
        run: node --version

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t mahmoudtarek3500/cicd-node-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Push Docker image
        run: docker push mahmoudtarek3500/cicd-node-app:latest
      
      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

        - name: Setup SSH key
          run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cicd-ec2-key.pem
            chmod 600 ~/.ssh/cicd-ec2-key.pem

        - name: Deploy with Ansible
          env:
            EC2_HOST: ${{ secrets.EC2_HOST }}
          run: |
            ansible-playbook -i ansible/inventory ansible/deploy.yml \
              --private-key ~/.ssh/cicd-ec2-key.pem

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull mahmoudtarek3500/cicd-node-app:latest
            sudo docker stop cicd-container || true
            sudo docker rm cicd-container || true
            sudo docker run -d -p 3000:3000 --name cicd-container --restart unless-stopped mahmoudtarek3500/cicd-node-app:latest